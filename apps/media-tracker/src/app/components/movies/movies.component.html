<div class="movies-page">
    <!-- Header -->
    <div class="page-header">
        <div class="header-content">
            <h1 class="page-title">
                <span class="material-symbols-outlined text-primary">movie</span> Movie Library
            </h1>
            <p class="page-subtitle">{{ movies.length }} Movies</p>
        </div>
        <div class="header-actions">
            <div class="view-toggle">
                <button class="toggle-btn" [class.active]="viewMode === 'grid'" (click)="viewMode = 'grid'">
                    <span class="material-symbols-outlined">grid_view</span>
                </button>
                <button class="toggle-btn" [class.active]="viewMode === 'list'" (click)="viewMode = 'list'">
                    <span class="material-symbols-outlined">view_list</span>
                </button>
            </div>
        </div>
    </div>
    <!-- Filters -->
    <div class="filters-bar">
        <div class="search-box">
            <span class="material-symbols-outlined">search</span>
            <input type="text" class="c-input" placeholder="Search movies..." [(ngModel)]="searchQuery">
        </div>
        <div class="filter-group">
            <select [(ngModel)]="selectedGenre" class="filter-select"> @for (genre of genres; track genre.id) { <option [value]="genre.id">{{ genre.name }}</option> } </select>
            <select [(ngModel)]="selectedYear" class="filter-select">
                <option value="all">All Years</option> @for (year of years; track year) { @if (year !== 'all') { <option [value]="year">{{ year }}</option> } }
            </select>
            <select [(ngModel)]="sortBy" class="filter-select">
                <option value="popular">Most Popular</option>
                <option value="rating">Highest Rated</option>
                <option value="newest">Newest First</option>
                <option value="title">A-Z</option>
            </select>
        </div>
    </div>
    <!-- Movies Grid -->
    <div class="movies-grid" [class.list-view]="viewMode === 'list'"> @for (movie of movies; track movie.id) { <div class="movie-card" (click)="openMediaModal(movie)">
            <div class="movie-poster">
                <img [src]="getImageUrl(movie.poster_path)" [alt]="movie.title">
                <div class="poster-overlay">
                    <button class="action-btn">
                        <span class="material-symbols-outlined">play_arrow</span>
                    </button>
                    <button class="action-btn small">
                        <span class="material-symbols-outlined">bookmark</span>
                    </button>
                </div>
                <div class="rating-badge">
                    <span class="material-symbols-outlined">star</span> {{ getRating(movie.vote_average) }}
                </div>
            </div>
            <div class="movie-info">
                <h3 class="movie-title">{{ movie.title }}</h3>
                <p class="movie-meta">{{ movie.release_date | slice:0:4 }}</p>
            </div>
        </div> } </div>
    <!-- Pagination -->
    <div class="pagination">
        <button class="page-btn" disabled>
            <span class="material-symbols-outlined">chevron_left</span>
        </button>
        <button class="page-btn active">1</button>
        <button class="page-btn">2</button>
        <button class="page-btn">3</button>
        <span class="page-ellipsis">...</span>
        <button class="page-btn">20</button>
        <button class="page-btn">
            <span class="material-symbols-outlined">chevron_right</span>
        </button>
    </div>
</div>
