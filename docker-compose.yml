services:
  hub:
    build: 
      context: ./apps/hub
      dockerfile: Dockerfile
    container_name: nexus-hub
    restart: unless-stopped
    ports:
      - "5100:8080"
    volumes:
      - ./data/hub_pb_data:/pb/pb_data
    networks:
      - nexus_net

  media-tracker:
    build:
      context: ./apps/media-tracker
      dockerfile: Dockerfile
    container_name: nexus-media
    restart: unless-stopped
    ports:
      - "5101:8080"
    volumes:
      - ./data/media_pb_data:/pb/pb_data
    networks:
      - nexus_net

  finance-tracker:
    build:
      context: ./apps/finance-tracker
      dockerfile: Dockerfile
    container_name: nexus-finance
    restart: unless-stopped
    ports:
      - "5103:8080"
    volumes:
      - ./data/finance_pb_data:/pb/pb_data
    networks:
      - nexus_net

networks:
  nexus_net:
    driver: bridge
